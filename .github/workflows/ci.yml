name: Node.js CI Pipeline

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # JOB 1: Multi-version testing
  build-and-test:
    name: Test Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Run Automated Tests
        run: npm test

  # JOB 2: Build and verify Docker image
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Build Docker Image
        run: |
          docker build \
            -t github-actions-ci-app:${{ github.sha }} .

      - name: Verify Docker Image
        run: |
          docker image inspect \
            github-actions-ci-app:${{ github.sha }}

  # JOB 3: Publish image to GHCR
  docker-publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: docker-build

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Image Name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" \
            >> "$GITHUB_OUTPUT"

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ steps.image.outputs.name }}:latest \
            -t ${{ steps.image.outputs.name }}:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push \
            ${{ steps.image.outputs.name }}:latest

          docker push \
            ${{ steps.image.outputs.name }}:${{ github.sha }}
